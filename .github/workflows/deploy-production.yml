name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-lysimaco
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Test and build frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
      PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
    steps:
      - name: Configure verified SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/production_deploy"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/production_deploy" "$HOME/.ssh/known_hosts"
      - name: Deploy exact commit
        run: |
          ssh -i "$HOME/.ssh/production_deploy" \
            -p "$PRODUCTION_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$PRODUCTION_APP_DIR' && PRODUCTION_APP_DIR='$PRODUCTION_APP_DIR' bash deploy/deploy.sh '$GITHUB_SHA'"
